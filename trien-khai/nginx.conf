# Cổng vào duy nhất của máy chủ bản đồ. Nạp vào /etc/nginx/conf.d/default.conf
# nên cả tệp này nằm TRONG khối http của nginx — proxy_cache_path hợp lệ ở đây.
#
# Hai đường ra, cùng một dữ liệu:
#   /tiles/vietnam.pmtiles      MỘT tệp, trình duyệt đọc từng lát bằng Range.
#                               Đây là đường cho ứng dụng dùng style vector.
#   /tiles/nen/{z}/{x}/{y}.png  TileServer GL raster hoá. Đây là đường cho
#                               `cách 1` ở PLAN.md mục 6: E-Commune đổi đúng
#                               một dòng upstream nginx, không sửa mã.

# Raster hoá tốn CPU thật, không cache là mỗi lượt xem vẽ lại cả vùng.
proxy_cache_path /var/cache/nginx/o levels=1:2 keys_zone=o_nen:10m
                 max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /var/www;           # web/ : trang demo, style, vendor
    index index.html;

    # KHÔNG có try_files ... /index.html ở đây, và đừng thêm vào. Ô rơi vào SPA
    # fallback là nhận index.html mã 200: MapLibre giải mã HTML thành ô hỏng mà
    # không bắn một event lỗi nào. Xem PLAN.md mục 7 ý 3.

    # ---------------------------------------------- ô địa hình và ô độ dốc
    # Phạm vi phải khai TRƯỚC khối ô, không thì nó rơi vào `location /tiles/`
    # và trả 404. Trang đọc tệp này để biết đặt bounds nào cho source.
    location = /tiles/dia-hinh/phamvi.json {
        alias /var/www/phamvi.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    # Ô tĩnh dựng sẵn bằng scripts/dung-o-dia-hinh.py. Ngoài vùng thì KHÔNG có
    # tệp và nginx trả 404 thật — đúng thứ ta muốn: MapLibre coi ô 404 là ô
    # phẳng, nên ra ngoài Ninh Bình mặt đất phẳng chứ không vỡ.
    location ~ ^/tiles/(dia-hinh|do-doc|ve-tinh)/ {
        root /o-tinh;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";
    }

    # ------------------------------------------------- ô vector: một tệp PMTiles
    location = /tiles/vietnam.pmtiles {
        alias /o-tinh/tiles/vietnam.pmtiles;
        default_type application/octet-stream;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
        # Ứng dụng khác gốc (Zalo Mini App) cần đọc được tệp này.
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length";
    }

    # ------------------------------------------------ ô raster: TileServer GL
    # proxy_pass có biến ($1...) nên nginx phân giải tên lúc CHẠY, và lúc chạy
    # thì phải có resolver — 127.0.0.11 là DNS nội bộ của Docker. Đây cũng là
    # cách an toàn hơn: viết dạng tĩnh thì nginx phân giải lúc NẠP cấu hình, ô
    # raster chưa lên là cả nginx không khởi động được. PLAN.md mục 6.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ~ ^/tiles/nen/(\d+)/(\d+)/(\d+)\.png$ {
        set $o_raster o-raster;
        proxy_pass http://$o_raster:8080/styles/nen-pho/$1/$2/$3.png;
        proxy_cache o_nen;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;        # 404 ngắn thôi: build lại là có ô
        proxy_cache_lock on;             # mười người xem một chỗ -> vẽ một lần
        add_header X-Tile-Cache $upstream_cache_status;
        add_header Access-Control-Allow-Origin "*";
    }

    # Style và vendor: đổi style thì phải thấy ngay, đừng cache lâu.
    location /style/ {
        add_header Cache-Control "public, max-age=60";
        add_header Access-Control-Allow-Origin "*";
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }
    location /chu-quyen/ {
        # Đường cho client KHÔNG dùng được style vector (Mini App dùng Leaflet).
        # Một nguồn dữ liệu, không bản sao. PLAN.md mục 4.
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }
}
