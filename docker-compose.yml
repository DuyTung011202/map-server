# Máy chủ bản đồ dùng chung. Không có dòng mã máy chủ nào tự viết — chỉ ghép
# hai phần mềm mã nguồn mở. Xem PLAN.md phase 1a.
#
#   docker compose up -d
#   http://localhost:8088/                     trang demo
#   http://localhost:8088/tiles/nen/12/3253/1812.png   ô raster cho `cách 1`
#
# Chạy trên máy riêng nên cổng bind vào 127.0.0.1: không mở ra mạng. Lên máy
# chủ thật thì nó nằm SAU nginx của E-Commune, trình duyệt không gọi thẳng —
# PLAN.md mục 7 ý 1. Lúc đó đổi cổng ở đây, không đổi gì khác.

services:
  # Raster hoá style vector thành PNG. Đọc THẲNG .pmtiles, không cần đổi sang
  # mbtiles. Không publish cổng: chỉ nginx gọi nó qua mạng nội bộ của compose.
  o-raster:
    image: maptiler/tileserver-gl:v5.7.0
    command: ["-c", "/data/config.json"]
    restart: unless-stopped
    volumes:
      - ./trien-khai/tileserver.json:/data/config.json:ro
      - ./data/tiles:/data/pmtiles:ro
      - ./web/vendor/font:/data/fonts:ro
      # Style và sprite phải nằm cùng thư mục: style khai sprite bằng
      # {styleJsonFolder}/sprite/sprite — xem scripts/dung-style.py.
      - ./web/style/nen-pho-may.json:/data/styles/nen-pho-may.json:ro
      - ./web/vendor/sprite:/data/styles/sprite:ro

  # Cổng vào: trang demo, tệp PMTiles (Range), và cache cho ô raster.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./trien-khai/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/var/www:ro
      # Gắn vào ĐÚNG data/tiles chứ không gắn cả data/: thư mục đó còn chứa
      # osm/ 1.7 GB và dem/, không có lý do gì để nginx nhìn thấy chúng.
      - ./data/tiles:/o-tinh/tiles:ro
      - cache-o:/var/cache/nginx
    depends_on:
      - o-raster

volumes:
  # Ô raster đã vẽ. Xoá được bất cứ lúc nào, vẽ lại là có.
  cache-o:
