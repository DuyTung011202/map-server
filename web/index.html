<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Máy chủ bản đồ — trang demo</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="giao-dien.css">
</head>
<body>

<div id="bando"></div>

<div id="tim">
  <input id="tim-o" type="search" autocomplete="off"
         placeholder="Tìm điểm trong vùng đang xem…">
  <div id="tim-nhom"></div>
  <div id="tim-ket-qua"></div>
</div>

<section id="bang">
  <h1>Máy chủ bản đồ
    <small>Trang demo — không có dữ liệu nghiệp vụ</small>
  </h1>

  <p id="canh-bao-chu-quyen"></p>

  <div class="nhom">
    <h2>Nền bản đồ</h2>
    <label class="dong"><input type="radio" name="nen" value="nenPho" checked> Nền đường phố</label>
    <label class="dong"><input type="radio" name="nen" value="veTinh"> Ảnh vệ tinh</label>
  </div>

  <div class="nhom">
    <h2>Lớp phủ</h2>
    <label class="dong"><input type="checkbox" id="bat-dia-hinh"> Địa hình 3D</label>
    <p class="ghi-chu" id="ghi-chu-dia-hinh">Đang đọc phạm vi…</p>
    <label class="dong"><input type="checkbox" id="bat-do-doc"> Lớp độ dốc</label>
    <div id="chu-giai"></div>
    <label class="dong" style="margin-top:4px">
      <span style="color:var(--chu-mo);font-size:12px">Độ mờ lớp phủ</span>
    </label>
    <input type="range" id="do-mo" min="0" max="100" value="70">
  </div>

  <div class="nhom">
    <h2>Trạng thái nguồn ô</h2>
    <div id="trang-thai"></div>
    <p class="ghi-chu" style="margin-left:0">
      MapLibre coi ô 404 là ô rỗng và không báo lỗi, nên các nguồn được gọi thử
      trực tiếp. Lần gọi thứ hai nên thấy <code>X-Tile-Cache: HIT</code>.
    </p>
  </div>
</section>

<div id="ghi-cong"></div>

<!-- Thứ tự nạp có ý nghĩa, đừng đảo:
       cauhinh    -> hằng số, không phụ thuộc gì
       kiem-o     -> phân loại phản hồi, dùng bởi trang-thai
       tim-kiem   -> lõi tìm kiếm, assert chạy ở ?self-check
       trang-thai -> bảng trạng thái, dùng bởi ban-do
       tim-nhanh  -> giao diện tìm, ban-do gọi khi map sẵn sàng
       ban-do     -> dựng map, phải nạp SAU cùng
     Không có bước build: trình duyệt nạp thẳng từng tệp. -->
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="cauhinh.js"></script>
<script src="kiem-o.js"></script>
<script src="tim-kiem.js"></script>
<script src="trang-thai.js"></script>
<script src="tim-nhanh.js"></script>
<script src="ban-do.js"></script>
</body>
</html>
